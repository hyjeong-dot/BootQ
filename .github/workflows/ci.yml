name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Install dependencies (lockfile 그대로)
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q
